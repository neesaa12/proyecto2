[project]
name = "tareas"
version = "1.0.0"
description = "CLI para preparar una entrega de clase: reunir apuntes y capturas, crear un índice y acciones IA."
readme = "README.md"
authors = [
    { name = "neesaa12", email = "vanpetayg@alu.edu.gva.es" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "typer>=0.29.3",
]

[project.scripts]
tareas = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
